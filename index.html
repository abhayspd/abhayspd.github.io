<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhay Siripudi | Mechatronics</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@300;500;800&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow-x: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; scrollbar-width: none; -ms-overflow-style: none; }
        body::-webkit-scrollbar { display: none; }
        #three-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        
        /* Greatly increased scroll height to match the massive desk */
        #scroll-container { position: absolute; top: 0; left: 0; width: 100%; height: 800vh; z-index: 10; }

        #audio-unlock { position: fixed; inset: 0; background: #0f172a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: flex; flex-direction: column; justify-content: center; padding: 10%; opacity: 0; transition: opacity 0.5s ease-out; }
        .ui-layer.active { opacity: 1; }

        #project-modal { position: fixed; right: 5%; bottom: 10%; z-index: 50; display: flex; align-items: flex-end; justify-content: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        #project-modal.visible { opacity: 1; pointer-events: auto; }
        
        .modal-content { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-left: 4px solid #38bdf8; padding: 2.5rem; max-width: 500px; color: white; transform: translateX(50px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #project-modal.visible .modal-content { transform: translateX(0); }

        #cursor-hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; background: rgba(255,255,255,0.5); border-radius: 50%; z-index: 30; pointer-events: none; transition: all 0.2s; }
        #cursor-hint.active { transform: translate(-50%, -50%) scale(2); background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
    </style>
</head>
<body>

    <div id="audio-unlock">
        <h1 class="text-3xl font-bold text-white mb-6 font-mono">Hardware Initialization</h1>
        <button id="start-btn" class="px-8 py-4 bg-red-600 hover:bg-red-500 text-white rounded-lg font-bold transition-all">
            BOOT 6-DOF ENGINE
        </button>
    </div>

    <canvas id="three-canvas"></canvas>
    <div id="scroll-container"></div>
    <div id="cursor-hint"></div>

    <div class="ui-layer active" id="ui-0">
        <div class="max-w-3xl">
            <h1 class="text-7xl font-extrabold tracking-tighter text-white mb-4">
                Abhay Siripudi.
            </h1>
            <p class="text-2xl text-slate-400 font-light font-mono border-l-2 border-red-500 pl-4">
                Mechatronics & Hardware Engineering. <br>Scroll to travel across the workspace.
            </p>
        </div>
    </div>

    <div class="ui-layer" id="ui-3" style="align-items: center; text-align: center;">
        <h2 class="text-6xl font-bold text-white mb-4">End of Line.</h2>
        <p class="text-xl text-red-500 font-mono">> SYSTEMS STANDBY</p>
    </div>

    <!-- Info Panel (Shows up on bottom right when blueprint is held to screen) -->
    <div id="project-modal">
        <div class="modal-content">
            <div class="text-red-500 font-mono text-sm mb-2 font-bold tracking-widest">DATA EXTRACTED</div>
            <h2 id="modal-title" class="text-3xl font-bold text-white mb-4">PROJECT TITLE</h2>
            <p id="modal-desc" class="text-slate-300 text-base leading-relaxed mb-8">Description goes here.</p>
            <button id="close-modal-btn" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white font-mono text-sm transition-colors border border-slate-600">
                [X] RETURN BLUEPRINT
            </button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let servoSynth;
        let isAudioReady = false;

        document.getElementById('start-btn').addEventListener('click', async () => {
            await Tone.start();
            servoSynth = new Tone.FMSynth({
                harmonicity: 2, modulationIndex: 5,
                oscillator: { type: "square" }, modulation: { type: "sawtooth" },
                envelope: { attack: 0.1, decay: 0.1, sustain: 1, release: 0.2 }
            }).toDestination();
            servoSynth.volume.value = -Infinity;
            servoSynth.triggerAttack(100);
            
            isAudioReady = true;
            document.getElementById('audio-unlock').style.opacity = '0';
            setTimeout(() => document.getElementById('audio-unlock').remove(), 500);
        });

        function updateServoSound(speed) {
            if(!isAudioReady || !servoSynth) return;
            if(speed > 0.005) {
                servoSynth.volume.rampTo(-25 + (Math.min(speed, 0.1) * 100), 0.1);
                servoSynth.frequency.rampTo(100 + (speed * 1500), 0.1);
            } else {
                servoSynth.volume.rampTo(-Infinity, 0.2);
            }
        }

        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.003); // Lighter fog for massive desk

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const spotLight = new THREE.SpotLight(0xffffff, 1.2);
        spotLight.position.set(0, 300, 100);
        spotLight.angle = Math.PI / 3;
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 2048;
        spotLight.shadow.mapSize.height = 2048;
        scene.add(spotLight);


        // --- MASSIVE DESK ---
        const deskMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.1 });
        const desk = new THREE.Mesh(new THREE.PlaneGeometry(1500, 1500), deskMat);
        desk.rotation.x = -Math.PI / 2;
        desk.receiveShadow = true;
        scene.add(desk);

        // Engraving
        function createEngraving() {
            const ctxCanvas = document.createElement('canvas');
            ctxCanvas.width = 2048; ctxCanvas.height = 512;
            const ctx = ctxCanvas.getContext('2d');
            ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 2048, 512);
            ctx.font = '800 120px "JetBrains Mono"'; ctx.fillStyle = '#0f172a';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
            ctx.fillText('ABHAY SIRIPUDI', 1024, 256);
            return new THREE.CanvasTexture(ctxCanvas);
        }
        const engMat = new THREE.MeshStandardMaterial({ map: createEngraving(), roughness: 0.9, bumpMap: createEngraving(), bumpScale: 1.5 });
        const engraving = new THREE.Mesh(new THREE.PlaneGeometry(200, 50), engMat);
        engraving.rotation.x = -Math.PI / 2;
        engraving.position.set(0, 0.2, -50);
        scene.add(engraving);


        // --- BLUEPRINTS ---
        const blueprints = [];
        function createBPTexture(title) {
            const ctxCanvas = document.createElement('canvas');
            ctxCanvas.width = 512; ctxCanvas.height = 512;
            const ctx = ctxCanvas.getContext('2d');
            ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 2;
            for(let i=0; i<=512; i+=32) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke(); }
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8; ctx.strokeRect(20, 20, 472, 472);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px "JetBrains Mono"';
            ctx.fillText(title, 40, 80);
            ctx.font = '24px "JetBrains Mono"'; ctx.fillText('[ CLICK TO INSPECT ]', 40, 140);
            return new THREE.CanvasTexture(ctxCanvas);
        }

        const bpGeo = new THREE.PlaneGeometry(40, 40); // Larger blueprints
        
        // BP1: Far South East
        const bp1 = new THREE.Mesh(bpGeo, new THREE.MeshStandardMaterial({ map: createBPTexture('UAV DIFF. MECH'), side: THREE.DoubleSide }));
        bp1.rotation.x = -Math.PI / 2; bp1.rotation.z = Math.PI / 6;
        bp1.position.set(150, 0.2, 150);
        bp1.receiveShadow = true; bp1.castShadow = true;
        bp1.userData = { isBlueprint: true, title: "UAV DIFFERENTIAL", desc: "Kinematic design for fixed-wing stabilization. Replaces dual servos with a single differential mechanical linkage." };
        scene.add(bp1); blueprints.push(bp1);

        // BP2: Far South West
        const bp2 = new THREE.Mesh(bpGeo, new THREE.MeshStandardMaterial({ map: createBPTexture('SENSOR FUSION'), side: THREE.DoubleSide }));
        bp2.rotation.x = -Math.PI / 2; bp2.rotation.z = -Math.PI / 8;
        bp2.position.set(-180, 0.2, 350);
        bp2.receiveShadow = true; bp2.castShadow = true;
        bp2.userData = { isBlueprint: true, title: "ESP32 SENSOR FUSION", desc: "C++ Implementation of a Kalman filter integrating MPU6050 accelerometer and gyroscope data for rigid stability." };
        scene.add(bp2); blueprints.push(bp2);


        // --- PROCEDURAL ELECTRONICS & HARDWARE ---
        const silverMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8, roughness: 0.2 });
        const blackMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.3 });

        // 1. High Poly Arduino Uno
        const arduino = new THREE.Group();
        const aBoard = new THREE.Mesh(new THREE.BoxGeometry(20, 1, 28), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
        aBoard.position.y = 0.5; aBoard.castShadow = true; arduino.add(aBoard);
        const aUSB = new THREE.Mesh(new THREE.BoxGeometry(5, 4, 6), silverMat);
        aUSB.position.set(-7, 2.5, 11); aUSB.castShadow = true; arduino.add(aUSB);
        const aChip = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 14), blackMat);
        aChip.position.set(4, 1.25, -2); aChip.castShadow = true; arduino.add(aChip);
        const aHeader = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 12), blackMat);
        aHeader.position.set(-8, 1.75, -5); arduino.add(aHeader);
        arduino.position.set(80, 0, 50); arduino.rotation.y = Math.PI / 4;
        scene.add(arduino);

        // 2. MPU6050 Sensor
        const mpu = new THREE.Group();
        const mBoard = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, 8), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
        mBoard.position.y = 0.25; mpu.add(mBoard);
        const mChip = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 3), blackMat);
        mChip.position.y = 0.75; mpu.add(mChip);
        for(let i=0; i<4; i++) {
            const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3), goldMat);
            pin.position.set(-3.5, 1.5, -2 + (i*1.5)); mpu.add(pin);
        }
        mpu.position.set(100, 0, 70); mpu.rotation.y = -Math.PI / 6;
        scene.add(mpu);

        // 3. L298N Motor Driver
        const l298n = new THREE.Group();
        const lBoard = new THREE.Mesh(new THREE.BoxGeometry(16, 1, 16), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
        lBoard.position.y = 0.5; l298n.add(lBoard);
        const heatSink = new THREE.Mesh(new THREE.BoxGeometry(14, 8, 4), blackMat);
        heatSink.position.set(0, 4.5, -5); heatSink.castShadow = true; l298n.add(heatSink);
        const terminal = new THREE.Mesh(new THREE.BoxGeometry(14, 3, 4), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
        terminal.position.set(0, 2, 5); l298n.add(terminal);
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 5, 16), blackMat);
        cap.position.set(-5, 3, 0); l298n.add(cap);
        l298n.position.set(-100, 0, 100); l298n.rotation.y = Math.PI / 3;
        scene.add(l298n);

        // 4. Yellow TT Gear Motors
        function createMotor(x, z, rot) {
            const motorGroup = new THREE.Group();
            const gearbox = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 12), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
            gearbox.position.y = 2; gearbox.castShadow = true; motorGroup.add(gearbox);
            const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 6, 16), silverMat);
            cylinder.rotation.x = Math.PI / 2; cylinder.position.set(0, 2, -9); cylinder.castShadow = true; motorGroup.add(cylinder);
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 12, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            shaft.rotation.z = Math.PI / 2; shaft.position.set(0, 2, 2); motorGroup.add(shaft);
            motorGroup.position.set(x, 0, z); motorGroup.rotation.y = rot;
            scene.add(motorGroup);
        }
        createMotor(-80, 80, 0);
        createMotor(-70, 90, Math.PI / 4);

        // 5. High Poly Circular Saw (Resting on table)
        const saw = new THREE.Group();
        const sBody = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 12, 32), new THREE.MeshStandardMaterial({ color: 0xea580c }));
        sBody.rotation.x = Math.PI / 2; sBody.position.y = 5; sBody.castShadow = true; saw.add(sBody);
        const sBlade = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 0.5, 32), silverMat);
        sBlade.rotation.x = Math.PI / 2; sBlade.position.set(4, 5, -6); sBlade.castShadow = true; saw.add(sBlade);
        const sHandle = new THREE.Mesh(new THREE.BoxGeometry(2, 8, 6), blackMat);
        sHandle.position.set(0, 8, 4); sHandle.castShadow = true; saw.add(sHandle);
        saw.position.set(200, 0, 250); saw.rotation.y = -Math.PI / 3;
        scene.add(saw);

        // 6. High Poly Power Drill
        const drill = new THREE.Group();
        const dBody = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 16, 32), new THREE.MeshStandardMaterial({ color: 0xea580c }));
        dBody.rotation.z = Math.PI / 2; dBody.position.y = 3; dBody.castShadow = true; drill.add(dBody);
        const dChuck = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 3, 6, 32), silverMat);
        dChuck.rotation.z = -Math.PI / 2; dChuck.position.set(11, 3, 0); dChuck.castShadow = true; drill.add(dChuck);
        const dHandle = new THREE.Mesh(new THREE.BoxGeometry(4, 12, 4), blackMat);
        dHandle.rotation.z = Math.PI / 6; dHandle.position.set(-2, 3, 6); dHandle.castShadow = true; drill.add(dHandle);
        drill.position.set(-250, 0, 200); drill.rotation.y = Math.PI / 2.5; drill.rotation.x = Math.PI / 2; // Lying flat
        scene.add(drill);


        // --- 6-DOF ROBOTIC ARM & ROVER ---
        const roverGroup = new THREE.Group();
        scene.add(roverGroup);

        const redMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 }); // Vibrant red
        const greyMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.6 }); // Base grey
        const servoMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 }); // Black servos

        // Base Wheels/Platform
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(16, 3, 22), servoMat);
        chassis.position.y = 3; chassis.castShadow = true; roverGroup.add(chassis);
        const wheels = [];
        for(let i=0; i<4; i++) {
            const w = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 2, 32), servoMat);
            w.rotation.z = Math.PI / 2; 
            w.position.set(i<2?9:-9, 3, i%2===0?8:-8);
            w.castShadow = true; roverGroup.add(w); wheels.push(w);
        }

        // 1. Base (Yaw)
        const joint1_base = new THREE.Group(); joint1_base.position.y = 4.5; roverGroup.add(joint1_base);
        const baseCyl = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 4, 64), greyMat);
        baseCyl.position.y = 2; baseCyl.castShadow = true; joint1_base.add(baseCyl);
        const yawServo = new THREE.Mesh(new THREE.BoxGeometry(5, 5, 5), servoMat);
        yawServo.position.set(4, 4, 0); joint1_base.add(yawServo);

        // 2. Shoulder (Pitch)
        const joint2_shoulder = new THREE.Group(); joint2_shoulder.position.y = 4; joint1_base.add(joint2_shoulder);
        const shoulderJoint = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 8, 32), redMat);
        shoulderJoint.rotation.z = Math.PI/2; shoulderJoint.castShadow = true; joint2_shoulder.add(shoulderJoint);
        const bicep = new THREE.Mesh(new THREE.BoxGeometry(4, 18, 4), redMat);
        bicep.position.y = 9; bicep.castShadow = true; joint2_shoulder.add(bicep);
        const shoulderServo = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 6), servoMat);
        shoulderServo.position.set(3, 9, 0); joint2_shoulder.add(shoulderServo);

        // 3. Elbow (Pitch)
        const joint3_elbow = new THREE.Group(); joint3_elbow.position.y = 18; joint2_shoulder.add(joint3_elbow);
        const elbowJoint = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 7, 32), redMat);
        elbowJoint.rotation.z = Math.PI/2; elbowJoint.castShadow = true; joint3_elbow.add(elbowJoint);
        const forearm = new THREE.Mesh(new THREE.BoxGeometry(3, 16, 3), redMat);
        forearm.position.y = 8; forearm.castShadow = true; joint3_elbow.add(forearm);
        const elbowServo = new THREE.Mesh(new THREE.BoxGeometry(3.5, 5, 5), servoMat);
        elbowServo.position.set(-2.5, 8, 0); joint3_elbow.add(elbowServo);

        // 4. Wrist (Pitch)
        const joint4_wrist = new THREE.Group(); joint4_wrist.position.y = 16; joint3_elbow.add(joint4_wrist);
        const wristJoint = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 6, 32), redMat);
        wristJoint.rotation.z = Math.PI/2; wristJoint.castShadow = true; joint4_wrist.add(wristJoint);
        const wristBody = new THREE.Mesh(new THREE.BoxGeometry(2.5, 4, 2.5), redMat);
        wristBody.position.y = 2; joint4_wrist.add(wristBody);

        // 5. Wrist (Roll)
        const joint5_roll = new THREE.Group(); joint5_roll.position.y = 4; joint4_wrist.add(joint5_roll);
        const rollServo = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), new THREE.MeshStandardMaterial({color: 0x2563eb})); // Blue servo head from reference
        rollServo.position.y = 1.5; rollServo.castShadow = true; joint5_roll.add(rollServo);

        // 6. Gripper
        const joint6_gripper = new THREE.Group(); joint6_gripper.position.y = 3; joint5_roll.add(joint6_gripper);
        const clawL = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 2), greyMat);
        clawL.position.set(2, 4, 0); clawL.rotation.z = Math.PI/12; clawL.castShadow = true; joint6_gripper.add(clawL);
        const clawR = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 2), greyMat);
        clawR.position.set(-2, 4, 0); clawR.rotation.z = -Math.PI/12; clawR.castShadow = true; joint6_gripper.add(clawR);


        // Init Poses
        joint2_shoulder.rotation.x = Math.PI / 6;
        joint3_elbow.rotation.x = Math.PI / 3;
        joint4_wrist.rotation.x = Math.PI / 4;
        roverGroup.position.set(0, 0, 20); // Start slightly in front of engraving



        // --- INTERACTION LOGIC ---
        let appState = 'SCROLL'; // SCROLL, DRIVE_TO, GRAB, PRESENT, RETURN
        let targetBP = null;
        let bpOriginalPos = new THREE.Vector3();
        let bpOriginalQuat = new THREE.Quaternion();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const cursorHint = document.getElementById('cursor-hint');

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            cursorHint.style.left = e.clientX + 'px';
            cursorHint.style.top = e.clientY + 'px';

            if(appState === 'SCROLL') {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(blueprints);
                if(intersects.length > 0) {
                    cursorHint.classList.add('active');
                    document.body.style.cursor = 'pointer';
                } else {
                    cursorHint.classList.remove('active');
                    document.body.style.cursor = 'default';
                }
            }
        });

        window.addEventListener('click', () => {
            if(appState !== 'SCROLL') return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blueprints);
            
            if(intersects.length > 0) {
                targetBP = intersects[0].object;
                targetBP.getWorldPosition(bpOriginalPos);
                targetBP.getWorldQuaternion(bpOriginalQuat);
                
                document.getElementById('modal-title').innerText = targetBP.userData.title;
                document.getElementById('modal-desc').innerText = targetBP.userData.desc;

                document.body.style.overflow = 'hidden'; // Lock scroll
                cursorHint.classList.remove('active');
                appState = 'DRIVE_TO';
            }
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('project-modal').classList.remove('visible');
            appState = 'RETURN';
        });

        // --- CAMERA & SCROLL WAYPOINTS ---
        // Massive distances to require real scrolling
        const waypoints = [
            { cam: new THREE.Vector3(0, 80, 100), look: new THREE.Vector3(0,0,-50), rover: new THREE.Vector3(0, 0, 20) }, // Intro
            { cam: new THREE.Vector3(150, 80, 250), look: new THREE.Vector3(150,0,150), rover: new THREE.Vector3(150, 0, 180) }, // BP1 (South East)
            { cam: new THREE.Vector3(-180, 80, 450), look: new THREE.Vector3(-180,0,350), rover: new THREE.Vector3(-180, 0, 380) }, // BP2 (South West)
            { cam: new THREE.Vector3(0, 60, 650), look: new THREE.Vector3(0,0,550), rover: new THREE.Vector3(0, 0, 600) } // End (Wave)
        ];

        let scrollProgress = 0;
        window.addEventListener('scroll', () => {
            if(appState === 'SCROLL') {
                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                scrollProgress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
                
                document.querySelectorAll('.ui-layer').forEach(el => el.classList.remove('active'));
                if(scrollProgress < 0.1) document.getElementById('ui-0').classList.add('active');
                if(scrollProgress > 0.9) document.getElementById('ui-3').classList.add('active');
            }
        });

        function getScrollState(p) {
            const scaledP = p * 3; 
            const idx = Math.floor(scaledP);
            const t = scaledP - idx;
            if (idx >= 3) return waypoints[3];
            const smoothT = t * t * (3 - 2 * t);
            return {
                cam: new THREE.Vector3().copy(waypoints[idx].cam).lerp(waypoints[idx+1].cam, smoothT),
                look: new THREE.Vector3().copy(waypoints[idx].look).lerp(waypoints[idx+1].look, smoothT),
                rover: new THREE.Vector3().copy(waypoints[idx].rover).lerp(waypoints[idx+1].rover, smoothT)
            };
        }


        // --- ANIMATION LOOP & KINEMATICS ---
        const clock = new THREE.Clock();
        const currentCamPos = waypoints[0].cam.clone();
        const currentCamLook = waypoints[0].look.clone();
        
        let targetRoverPos = new THREE.Vector3();
        let animTimer = 0;

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return a + diff * t;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            let targetRoverRot, tBase = 0, tShoulder = Math.PI/6, tElbow = Math.PI/3, tWrist = Math.PI/4, tRoll = 0, tGrip = 0;
            let totalSpeed = 0;

            if (appState === 'SCROLL') {
                const state = getScrollState(scrollProgress);
                currentCamPos.lerp(state.cam, 0.05);
                currentCamLook.lerp(state.look, 0.05);
                targetRoverPos.copy(state.rover);
                
                const dir = new THREE.Vector3().subVectors(targetRoverPos, roverGroup.position);
                if(dir.lengthSq() > 1) targetRoverRot = Math.atan2(dir.x, dir.z);
                else targetRoverRot = roverGroup.rotation.y;

                // Idle breathing
                tShoulder = Math.PI/6 + Math.sin(time)*0.05;
                tElbow = Math.PI/3 + Math.cos(time)*0.05;

                // The Final Wave Sequence
                if(scrollProgress > 0.95) {
                    const dirToCam = new THREE.Vector3().subVectors(camera.position, roverGroup.position).normalize();
                    targetRoverRot = Math.atan2(dirToCam.x, dirToCam.z);
                    tShoulder = -Math.PI/8; // Stand tall
                    tElbow = Math.PI/8;
                    tWrist = -Math.PI/2 + Math.sin(time * 8) * 0.5; // Rapid wave
                }

            } else if (appState === 'DRIVE_TO') {
                // Drive to 25 units "South" of Blueprint
                targetRoverPos.copy(bpOriginalPos).add(new THREE.Vector3(0, 0, 25));
                const dir = new THREE.Vector3().subVectors(targetRoverPos, roverGroup.position);
                
                if(dir.lengthSq() > 1) {
                    targetRoverRot = Math.atan2(dir.x, dir.z);
                } else {
                    targetRoverRot = Math.atan2(bpOriginalPos.x - roverGroup.position.x, bpOriginalPos.z - roverGroup.position.z);
                    let angleDiff = Math.abs(lerpAngle(roverGroup.rotation.y, targetRoverRot, 1) - targetRoverRot);
                    if(angleDiff < 0.05) { appState = 'GRAB'; animTimer = 0; }
                }

            } else if (appState === 'GRAB') {
                targetRoverPos.copy(bpOriginalPos).add(new THREE.Vector3(0, 0, 25));
                targetRoverRot = Math.atan2(bpOriginalPos.x - roverGroup.position.x, bpOriginalPos.z - roverGroup.position.z);
                
                // Kinematics: Reach down to table
                tShoulder = Math.PI / 2.5; 
                tElbow = -Math.PI / 8;
                tWrist = -Math.PI / 3;

                animTimer += delta;
                if(animTimer > 1.5) {
                    joint6_gripper.attach(targetBP); // Lock blueprint to claws
                    appState = 'PRESENT';
                    animTimer = 0;
                }

            } else if (appState === 'PRESENT') {
                targetRoverPos.copy(bpOriginalPos).add(new THREE.Vector3(0, 0, 25));
                
                // Turn rover to perfectly face camera
                const dirToCam = new THREE.Vector3().subVectors(camera.position, roverGroup.position).normalize();
                targetRoverRot = Math.atan2(dirToCam.x, dirToCam.z);
                
                // Lift arm high
                tShoulder = 0;
                tElbow = Math.PI / 2;
                tWrist = -Math.PI / 2;

                // Mathematically force the blueprint to face the camera flat
                // Detach temporarily to rotate globally, then reattach
                scene.attach(targetBP);
                targetBP.quaternion.slerp(camera.quaternion, 0.1);
                joint6_gripper.attach(targetBP);

                animTimer += delta;
                if(animTimer > 2.0) {
                    document.getElementById('project-modal').classList.add('visible');
                    appState = 'VIEWING';
                }

            } else if (appState === 'VIEWING') {
                targetRoverPos.copy(bpOriginalPos).add(new THREE.Vector3(0, 0, 25));
                targetRoverRot = roverGroup.rotation.y;
                tShoulder = 0; tElbow = Math.PI / 2; tWrist = -Math.PI / 2;
                
                // Keep blueprint locked to camera view
                scene.attach(targetBP);
                targetBP.quaternion.copy(camera.quaternion);
                joint6_gripper.attach(targetBP);

            } else if (appState === 'RETURN') {
                targetRoverPos.copy(bpOriginalPos).add(new THREE.Vector3(0, 0, 25));
                targetRoverRot = Math.atan2(bpOriginalPos.x - roverGroup.position.x, bpOriginalPos.z - roverGroup.position.z);
                
                // Arm down
                tShoulder = Math.PI / 2.5; tElbow = -Math.PI / 8; tWrist = -Math.PI / 3;

                // Force blueprint to lay flat again
                scene.attach(targetBP);
                targetBP.quaternion.slerp(new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2, 0, bpOriginalPos.x > 0 ? Math.PI/6 : -Math.PI/8)), 0.1);
                joint6_gripper.attach(targetBP);

                animTimer += delta;
                if(animTimer > 2.0) {
                    scene.attach(targetBP); // Release
                    targetBP.position.copy(bpOriginalPos);
                    targetBP.quaternion.copy(bpOriginalQuat);
                    document.body.style.overflow = 'auto'; // Unlock
                    appState = 'SCROLL';
                }
            }


            // --- APPLY PHYSICS & SMOOTHING ---
            const dist = roverGroup.position.distanceTo(targetRoverPos);
            if(dist > 0.1) {
                roverGroup.position.lerp(targetRoverPos, 0.08);
                totalSpeed += dist * 0.1;
                wheels.forEach(w => w.rotation.x += dist * 0.05); // Spin wheels
            }

            const rotSpeed = 0.08;
            roverGroup.rotation.y = lerpAngle(roverGroup.rotation.y, targetRoverRot, rotSpeed);
            
            // Apply 6-DOF Joint Angles
            joint1_base.rotation.y = lerpAngle(joint1_base.rotation.y, tBase, rotSpeed);
            joint2_shoulder.rotation.x = lerpAngle(joint2_shoulder.rotation.x, tShoulder, rotSpeed);
            joint3_elbow.rotation.x = lerpAngle(joint3_elbow.rotation.x, tElbow, rotSpeed);
            joint4_wrist.rotation.x = lerpAngle(joint4_wrist.rotation.x, tWrist, rotSpeed);
            joint5_roll.rotation.y = lerpAngle(joint5_roll.rotation.y, tRoll, rotSpeed);

            // Audio Modulation
            totalSpeed += Math.abs(tShoulder - joint2_shoulder.rotation.x) + Math.abs(tElbow - joint3_elbow.rotation.x);
            updateServoSound(totalSpeed);

            // Camera Updates
            camera.position.copy(currentCamPos);
            camera.lookAt(currentCamLook);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
