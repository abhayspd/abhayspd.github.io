<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhay Siripudi | Mechanical Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;500;800&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow-x: hidden; background-color: #1a1614; font-family: 'Inter', sans-serif; height: 300vh; }
        
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        .ui-layer { position: fixed; z-index: 20; pointer-events: none; }
        
        #cursor { position: fixed; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background-color 0.2s; backdrop-filter: invert(1); }
        #cursor.hover { width: 30px; height: 30px; background-color: rgba(255,255,255,0.2); border-color: #fff; }

        /* The Help Screen UI */
        #help-screen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 400px; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; color: white; z-index: 30; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        #help-screen.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

        /* Back Button for zooming out of blueprints */
        #back-btn { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); padding: 12px 24px; background: white; color: black; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; z-index: 30; opacity: 0; pointer-events: none; transition: all 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: none; }
        #back-btn.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        #back-btn:hover { background: #e0e0e0; transform: translateX(-50%) scale(1.05); }

        #hint { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.6); font-family: 'JetBrains Mono'; font-size: 12px; pointer-events: none; z-index: 20; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div id="webgl-container"></div>
    
    <div id="hint">SCROLL TO EXPLORE WORKBENCH</div>

    <button id="back-btn">Return to Desk</button>

    <div id="help-screen">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">System Status</h2>
            <button id="close-help" class="text-gray-400 hover:text-white">&times;</button>
        </div>
        <div class="font-mono text-sm text-gray-300 space-y-4">
            <p>> OPERATOR: Abhay Siripudi</p>
            <p>> ROLE: Mechanical Engineer</p>
            <p>> STATUS: Ready for prototyping.</p>
            <hr class="border-gray-700">
            <p>Click on the blueprints on the desk to examine CAD and kinematics files.</p>
            <p>Scroll down to navigate the workspace.</p>
        </div>
    </div>

    <script>
        // --- CUSTOM CURSOR ---
        const cursor = document.getElementById('cursor');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        // --- STREAMING_CHUNK:Initializing Three.js Engine & Premium Lighting ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1614); // Very dark warm background
        scene.fog = new THREE.FogExp2(0x1a1614, 0.005);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Premium Hollywood-style color grading & shadow rendering
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Soft Studio Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff0dd, 2.5); // Warm key light
        mainLight.position.set(50, 100, 50);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xaaccff, 1.0); // Cool fill light
        fillLight.position.set(-50, 50, -50);
        scene.add(fillLight);


        // --- STREAMING_CHUNK:Creating Dark Walnut Desk with Real Engraving ---
        function createEngravedWoodMaterial() {
            // 1. Wood Color Texture
            const colorCanvas = document.createElement('canvas');
            colorCanvas.width = 1024; colorCanvas.height = 1024;
            const ctxColor = colorCanvas.getContext('2d');
            ctxColor.fillStyle = '#2b1b11'; // Dark Walnut base
            ctxColor.fillRect(0, 0, 1024, 1024);
            
            // Subtle wood grain
            ctxColor.fillStyle = 'rgba(20, 10, 5, 0.1)';
            for(let i=0; i<1000; i++) {
                ctxColor.fillRect(Math.random()*1024, Math.random()*1024, Math.random()*200, Math.random()*2);
            }
            const colorMap = new THREE.CanvasTexture(colorCanvas);
            colorMap.wrapS = colorMap.wrapT = THREE.RepeatWrapping;
            colorMap.repeat.set(4, 4);

            // 2. Bump Map for Engraving (Tricks lighting to create depth)
            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = 2048; bumpCanvas.height = 2048;
            const ctxBump = bumpCanvas.getContext('2d');
            ctxBump.fillStyle = '#888888'; // Neutral bump background
            ctxBump.fillRect(0, 0, 2048, 2048);
            
            // Draw the text in black (black = pushed inwards mathematically)
            ctxBump.fillStyle = '#000000';
            ctxBump.textAlign = 'center';
            ctxBump.textBaseline = 'middle';
            ctxBump.font = '900 120px "Inter"';
            ctxBump.fillText('ABHAY SIRIPUDI', 1024, 950);
            ctxBump.font = '500 40px "JetBrains Mono"';
            ctxBump.fillText('MECHANICAL ENGINEER', 1024, 1050);

            const bumpMap = new THREE.CanvasTexture(bumpCanvas);
            
            return new THREE.MeshPhysicalMaterial({
                map: colorMap,
                bumpMap: bumpMap,
                bumpScale: 1.5, // How deep the carving looks
                roughness: 0.6,
                clearcoat: 0.1, // Slight polish on the table
            });
        }

        const desk = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), createEngravedWoodMaterial());
        desk.rotation.x = -Math.PI / 2;
        desk.receiveShadow = true;
        scene.add(desk);


        // --- STREAMING_CHUNK:Generating High-Quality Blueprints ---
        const blueprints = [];
        
        function createBlueprintMaterial(title, subtitle) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // Classic dark blue blueprint paper
            ctx.fillStyle = '#0a192f'; ctx.fillRect(0, 0, 1024, 1024);
            
            // Grid lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 2;
            for(let i=0; i<=1024; i+=32) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,1024); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(1024,i); ctx.stroke();
            }
            
            // White border
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.strokeRect(30, 30, 964, 964);
            
            // Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 70px "Inter"'; ctx.textAlign = 'left';
            ctx.fillText(title, 60, 120);
            
            ctx.fillStyle = '#64ffda';
            ctx.font = '40px "JetBrains Mono"';
            ctx.fillText(subtitle, 60, 180);

            // Generic CAD sketch lines
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(512, 600, 200, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(512, 600, 150, 0, Math.PI*2); ctx.stroke();
            ctx.setLineDash([15, 15]);
            ctx.beginPath(); ctx.moveTo(100, 600); ctx.lineTo(924, 600); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(512, 250); ctx.lineTo(512, 950); ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            return new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.9, clearcoat: 0.0 });
        }

        const bpGeo = new THREE.PlaneGeometry(35, 35);
        
        // BP1: Placed fairly close
        const bp1 = new THREE.Mesh(bpGeo, createBlueprintMaterial('UAV DIFF. MECH', 'KINEMATIC ANALYSIS'));
        bp1.rotation.x = -Math.PI / 2; bp1.rotation.z = Math.PI / 12;
        bp1.position.set(40, 0.1, 30);
        bp1.receiveShadow = true; bp1.castShadow = true;
        scene.add(bp1); blueprints.push(bp1);

        // BP2: Placed further down
        const bp2 = new THREE.Mesh(bpGeo, createBlueprintMaterial('SENSOR FUSION', 'C++ / FIRMWARE'));
        bp2.rotation.x = -Math.PI / 2; bp2.rotation.z = -Math.PI / 8;
        bp2.position.set(-30, 0.1, 90);
        bp2.receiveShadow = true; bp2.castShadow = true;
        scene.add(bp2); blueprints.push(bp2);


        // --- STREAMING_CHUNK:Creating the Sleek "edh.dev" Style Helper Bot ---
        const botGroup = new THREE.Group();
        scene.add(botGroup);

        // High poly, smooth white plastic body
        const botBodyGeo = new THREE.CapsuleGeometry(2.5, 4, 32, 64);
        const botPlasticMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, 
            roughness: 0.1, 
            metalness: 0.1,
            clearcoat: 1.0, // This gives it that Apple/edh.dev premium gloss
            clearcoatRoughness: 0.1
        });
        const botBody = new THREE.Mesh(botBodyGeo, botPlasticMat);
        botBody.castShadow = true;
        botGroup.add(botBody);

        // Dark glass visor
        const visorGeo = new THREE.CylinderGeometry(2.6, 2.6, 2.5, 32, 1, false, -Math.PI/3, Math.PI/1.5);
        const visorMat = new THREE.MeshPhysicalMaterial({
            color: 0x050505,
            roughness: 0.0,
            transmission: 0.5, // Makes it look like actual glass
            transparent: true
        });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.position.y = 1;
        visor.rotation.y = Math.PI / 6;
        botGroup.add(visor);

        // Glowing eye inside visor
        const eyeGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x64ffda }); // Glowing cyan
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(0, 1, 2.2);
        botGroup.add(eye);


        // --- STREAMING_CHUNK:Raycasting & Interaction Logic ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        let currentState = 'SCROLLING'; // SCROLLING, ZOOMED, HELP
        let targetCamPos = new THREE.Vector3();
        let targetCamLook = new THREE.Vector3();
        let activeBlueprint = null;

        const backBtn = document.getElementById('back-btn');
        const helpScreen = document.getElementById('help-screen');
        const closeHelpBtn = document.getElementById('close-help');

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (currentState === 'SCROLLING') {
                raycaster.setFromCamera(mouse, camera);
                // Check intersect with blueprints OR the bot
                const intersects = raycaster.intersectObjects([...blueprints, botBody, visor]);
                
                if (intersects.length > 0) {
                    cursor.classList.add('hover');
                } else {
                    cursor.classList.remove('hover');
                }
            }
        });

        window.addEventListener('click', () => {
            if (currentState !== 'SCROLLING') return;

            raycaster.setFromCamera(mouse, camera);
            
            // 1. Check Bot Click
            const botIntersects = raycaster.intersectObjects([botBody, visor]);
            if (botIntersects.length > 0) {
                currentState = 'HELP';
                helpScreen.classList.add('active');
                cursor.classList.remove('hover');
                return;
            }

            // 2. Check Blueprint Click
            const bpIntersects = raycaster.intersectObjects(blueprints);
            if (bpIntersects.length > 0) {
                activeBlueprint = bpIntersects[0].object;
                currentState = 'ZOOMED';
                cursor.classList.remove('hover');
                
                // GSAP Cinematic Zoom in to the blueprint
                // Calculate position right above the blueprint
                const bpPos = activeBlueprint.position;
                
                gsap.to(camera.position, {
                    x: bpPos.x,
                    y: bpPos.y + 25, // Height above paper
                    z: bpPos.z + 5,
                    duration: 1.5,
                    ease: "power3.inOut"
                });

                // Animate an invisible target object that the camera looks at
                gsap.to(cameraLookTarget, {
                    x: bpPos.x,
                    y: bpPos.y,
                    z: bpPos.z,
                    duration: 1.5,
                    ease: "power3.inOut",
                    onComplete: () => {
                        backBtn.classList.add('active');
                    }
                });
            }
        });

        // HTML Button Events
        backBtn.addEventListener('click', () => {
            backBtn.classList.remove('active');
            currentState = 'SCROLLING';
            // Force a scroll event to snap camera back to correct scroll position
            window.dispatchEvent(new Event('scroll')); 
        });

        closeHelpBtn.addEventListener('click', () => {
            helpScreen.classList.remove('active');
            currentState = 'SCROLLING';
        });


        // --- STREAMING_CHUNK:Scroll Animation Logic ---
        let scrollY = 0;
        let maxScroll = 1;
        
        // Define camera path points
        const camPath = [
            { pos: new THREE.Vector3(0, 40, 20), look: new THREE.Vector3(0, 0, 0) }, // Intro viewing engraving
            { pos: new THREE.Vector3(40, 30, 50), look: new THREE.Vector3(40, 0, 30) }, // Look at BP1
            { pos: new THREE.Vector3(-30, 30, 110), look: new THREE.Vector3(-30, 0, 90) }, // Look at BP2
            { pos: new THREE.Vector3(0, 50, 150), look: new THREE.Vector3(0, 0, 100) } // Outro
        ];

        let cameraLookTarget = new THREE.Vector3(0,0,0);

        window.addEventListener('scroll', () => {
            maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            scrollY = window.scrollY;

            if (currentState === 'SCROLLING') {
                const progress = Math.min(Math.max(scrollY / maxScroll, 0), 1);
                
                // Interpolate between path points
                const segmentProgress = progress * (camPath.length - 1);
                const index = Math.floor(segmentProgress);
                const t = segmentProgress - index;

                if (index < camPath.length - 1) {
                    const p1 = camPath[index];
                    const p2 = camPath[index + 1];
                    
                    // Use GSAP to smoothly update target positions to avoid jitter
                    gsap.to(targetCamPos, {
                        x: p1.pos.x + (p2.pos.x - p1.pos.x) * t,
                        y: p1.pos.y + (p2.pos.y - p1.pos.y) * t,
                        z: p1.pos.z + (p2.pos.z - p1.pos.z) * t,
                        duration: 0.5, ease: "power1.out"
                    });
                    
                    gsap.to(targetCamLook, {
                        x: p1.look.x + (p2.look.x - p1.look.x) * t,
                        y: p1.look.y + (p2.look.y - p1.look.y) * t,
                        z: p1.look.z + (p2.look.z - p1.look.z) * t,
                        duration: 0.5, ease: "power1.out"
                    });
                }
            }
        });

        // Trigger initial scroll calculation
        window.dispatchEvent(new Event('scroll'));
        camera.position.copy(targetCamPos);
        cameraLookTarget.copy(targetCamLook);


        // --- STREAMING_CHUNK:Main Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smoothly move camera during scroll mode
            if (currentState === 'SCROLLING') {
                camera.position.lerp(targetCamPos, 0.05);
                cameraLookTarget.lerp(targetCamLook, 0.05);
            }
            
            // Always look at the target (updates for both scroll and zoom)
            camera.lookAt(cameraLookTarget);

            // Bot Hover Animation (Sine wave)
            botGroup.position.y = Math.sin(time * 2) * 1.5 + 8;
            
            // Bot Follow Logic: Make it glide near the camera
            // Offset slightly to the right and forward of the camera
            const botTargetX = camera.position.x + 15;
            const botTargetZ = camera.position.z - 20;
            
            botGroup.position.x += (botTargetX - botGroup.position.x) * 0.02;
            botGroup.position.z += (botTargetZ - botGroup.position.z) * 0.02;
            
            // Make bot look at the camera look target
            botGroup.lookAt(cameraLookTarget.x, botGroup.position.y, cameraLookTarget.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
